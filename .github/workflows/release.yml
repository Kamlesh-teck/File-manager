name: Release APK

# Sirf haath se chalta hai: Actions tab -> "Release APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Chaabi (keystore) taiyar karo
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Chaabi mil gayi, APK apni release key se sign hoga"
          else
            echo "::warning::KEYSTORE_BASE64 secret nahi mila. APK debug key se sign hoga (update ke liye theek nahi)"
          fi

      - name: Release APK banao
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: APK ki jaanch (signature aur size)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -lh "$APK"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -12 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AllInOneFM-release-apk
          path: app/build/outputs/apk/release/*.apk
